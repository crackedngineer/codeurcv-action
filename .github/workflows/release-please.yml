name: Release Please

on:
    push:
        branches:
            - master

permissions:
    contents: write
    pull-requests: write

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  token: ${{ secrets.GH_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - name: Move floating tags
              run: |
                  TAG=${{ needs.release-please.outputs.tag_name }}
                  MAJOR=$(echo $TAG | cut -d. -f1)
                  MINOR=$(echo $TAG | cut -d. -f1,2)

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  git tag -fa "$MAJOR" -m "Release $MAJOR"
                  git tag -fa "$MINOR" -m "Release $MINOR"
                  git push origin "$MAJOR" "$MINOR" --force

            - name: Publish to GitHub Marketplace
              uses: actions/github-script@v9
              with:
                  github-token: ${{ secrets.GH_TOKEN }}
                  script: |
                      const tag = "${{ needs.release-please.outputs.tag_name }}";
                      const releases = await github.rest.repos.getReleaseByTag({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        tag,
                      });

                      await github.rest.repos.updateRelease({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        release_id: releases.data.id,
                        make_latest: "true",
                        draft: false,
                        prerelease: false,
                      });
