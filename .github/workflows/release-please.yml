name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Move major/minor floating tags after each release
  # e.g. v1 and v1.2 always point to the latest patch
  tag-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move floating tags
        run: |
          TAG=${{ needs.release-please.outputs.tag_name }}
          MAJOR=$(echo $TAG | cut -d. -f1)
          MINOR=$(echo $TAG | cut -d. -f1,2)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update v1 and v1.2 to point to latest release
          git tag -fa "$MAJOR" -m "Release $MAJOR"
          git tag -fa "$MINOR" -m "Release $MINOR"
          git push origin "$MAJOR" "$MINOR" --force