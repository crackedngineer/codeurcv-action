name: codeurcv-action
description: "GitHub Action to render and compile a LaTeX resume template"
author: "crackedngineer"

inputs:
  out-dir:
    description: "Directory to save the generated PDF"
    required: false
    default: "output"

  config-path:
    description: "Path to your resume YAML or JSON config"
  
  template:
    description: "Override the resume template"
    required: false

  filename:
    description: "Override the output PDF filename (without .pdf)"


  commit-message:
    description: "Commit message for generated files"
    required: false
    default: "chore(pdf): update generated files"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install pdfLaTeX and pandoc
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-xetex \
          latexmk \
          pandoc
        sudo apt-get clean
    
    - name: Install codeurcv
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install codeurcv

    - name: Generate CV
      shell: bash
      run: |
        codeurcv run "${{ inputs.config-path }}" -o "${{ inputs.out-dir }}" -t "${{ inputs.template }}" -n "${{ inputs.filename }}"

    - name: Configure Git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit changes
      shell: bash
      run: |
        git add "${{ inputs.out-dir }}"/*.pdf

        if git diff --cached --quiet; then
          echo "✅ No changes to commit"
        else
          git commit -m "${{ inputs.commit-message }}"
          git push
        fi